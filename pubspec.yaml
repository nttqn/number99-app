name: number99
description: "99 Numbers - tim so theo yeu cau truoc khi het gio."
publish_to: 'none'

version: 1.3.0+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  # Pinned: 2.5.0 (2026-10-17, Pigeon JNI rewrite) hangs getInstance() in
  # real-device release builds — saves silently never persist. 2.4.28 is the
  # last pre-JNI release. Test a real release APK on a device before unpinning.
  shared_preferences_android: 2.4.28
  google_mobile_ads: ^9.1.0
  games_services: ^5.3.0
  flame_audio: ^2.12.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/audio/
