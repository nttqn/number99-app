name: number99
description: "99 Numbers - tim so theo yeu cau truoc khi het gio."
publish_to: 'none'

version: 1.2.3+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  games_services: ^5.3.0
  flame_audio: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/audio/
